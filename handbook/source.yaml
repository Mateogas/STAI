schema_version: 1
handbook_version: '1.0'
active: true
pages:
- page_key: front-01
  section: front
  kind: directory
  title: Welcome and educational boundary
  body: AISHA is a fictional educational capstone prototype and is not affiliated
    with, endorsed by, or representative of BDO Unibank.
- page_key: front-02
  section: front
  kind: directory
  title: How to use this handbook
  body: Use stable policy IDs, handbook version, and page together. Current guidance
    comes only from the explicitly active immutable edition.
- page_key: front-03
  section: front
  kind: directory
  title: Three-topic scope
  body: The closed onboarding topics are Payroll, Resource Access, and HR Policies.
    Unsupported topics abstain and route to a human.
- page_key: front-04
  section: front
  kind: directory
  title: Hire attributes
  body: Applicability uses only role, department, employment classification, and work
    site from the HR-confirmed Hire Profile.
- page_key: front-05
  section: front
  kind: directory
  title: Evidence and citations
  body: Every material policy claim requires claim-local support from an active authoritative
    applicable page.
- page_key: front-06
  section: front
  kind: directory
  title: Privacy and human support
  body: AISHA is support, not surveillance. HR receives consented structured records
    rather than raw private conversations.
