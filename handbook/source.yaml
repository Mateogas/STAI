- page_key: back-01
  section: back
  kind: directory
  title: 'Glossary: policy responses'
  body: Grounded Answer, Clarification Request, Abstention, and Escalation Offer are
    the four typed Dialogue outcomes.
- page_key: back-02
  section: back
  kind: directory
  title: 'Glossary: applicability'
  body: Applies, Does Not Apply, and Needs Clarification are deterministic outcomes;
    retrieval similarity never decides eligibility.
- page_key: back-03
  section: back
  kind: directory
  title: 'Glossary: retrieval'
  body: A Handbook Omission differs from a Knowledge Index Outage or integrity failure,
    and each fails closed with a distinct outcome.
- page_key: back-04
  section: back
  kind: directory
  title: 'Directory: Payroll Support'
  body: Payroll Support is the fictional route for pay schedule, payslip, deduction,
    and payroll correction questions.
- page_key: back-05
  section: back
  kind: directory
  title: 'Directory: Access Support'
  body: Access Support is the fictional route for accounts, devices, and other Company
    Resource guidance.
- page_key: back-06
  section: back
  kind: directory
  title: 'Directory: HR routes'
  body: HR General, HR Leave, and HR Privacy are fictional human routes selected by
    policy and subarea.
- page_key: back-07
  section: back
  kind: directory
  title: Version and supersession
  body: Handbook v1.0 is the initial immutable edition. Only explicit supersession
    can establish precedence between revisions.
- page_key: back-08
  section: back
  kind: directory
  title: Official document route
  body: AISHA never stores or submits an original medical certificate. The separate
    fictional Official HR Document Route remains required.
