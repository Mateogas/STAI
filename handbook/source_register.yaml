publication_rules:
  - Public sources provide legal or statutory context, never a real BDO policy.
  - Portal names, routes, cutoffs, paydays, and internal procedures remain synthetic demo rules.
  - AISHA does not calculate personalized tax, benefits, contributions, or legal entitlement.
  - Every adopted claim is rewritten for the fictional educational handbook and cited internally to this register.
