[project]
name = "stai"
version = "0.1.0"
description = "STAI - local-first agentic AI assistant for new-hire onboarding (HR capstone)"
authors = [{ name = "Mateogas" }]
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "langchain-chroma>=0.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "streamlit>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
# Repo lives under OneDrive; hardlinks from the uv cache fail there (os error 396).
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
